  </style>

  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">

    </svg>

  <script>
    const tl = gsap.timeline({ paused: true });
    const draw = (sel, at, dur, ease) => {
      const el = document.querySelector(sel);
      const len = el.getTotalLength ? el.getTotalLength() : 1600;
      gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
      tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || 'power2.out' }, at);
    };

    tl.fromTo('#l1', { opacity: 0, filter: 'blur(7px)' },
      { opacity: 1, filter: 'blur(0px)', duration: .75, ease: 'expo.out' }, 0);

    tl.fromTo('#q', { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: .6, ease: 'power4.out' }, .5);
    tl.fromTo('#gt', { opacity: 0 }, { opacity: 1, duration: .4 }, .95);
    tl.fromTo('#fr', { opacity: 0, x: -18 },
      { opacity: 1, x: 0, duration: .6, ease: 'power3.out' }, 1.25);

    draw('#axis path', 2.25, .8, 'power2.inOut');
    tl.fromTo('.tick', { opacity: 0 }, { opacity: 1, duration: .35, stagger: .1 }, 2.95);

    tl.fromTo('#qstar', { opacity: 0 }, { opacity: 1, duration: .4 }, 3.5);
    tl.fromTo('#qmark', { opacity: 0 }, { opacity: 1, duration: .45, ease: 'power2.out' }, 3.55);
    tl.fromTo('#actreg', { opacity: 0, scaleX: 0 },
      { opacity: .16, scaleX: 1, duration: .9, ease: 'power3.out', transformOrigin: 'left center' }, 4.4);
    tl.fromTo('#actlbl', { opacity: 0 }, { opacity: 1, duration: .5 }, 5.0);

    tl.fromTo('#note', { opacity: 0 }, { opacity: 1, duration: .7, ease: 'power2.out' }, 5.8);

    window.__timelines['s4'] = tl;
    tl.seek(0);
